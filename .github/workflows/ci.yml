name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The homebrew the suite runs, built with devkitPro (libnx and deko3d examples).
  homebrew:
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build libnx and deko3d examples
        run: scripts/ci_homebrew.sh
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew
          path: build/artifacts.tar.gz
          retention-days: 7

  # The real target: native ARM64 Linux, no emulation.
  arm64:
    needs: homebrew
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: homebrew
      - name: Unpack homebrew
        run: tar xzf artifacts.tar.gz
      - name: Install toolchain
        run: sudo scripts/setup_arm64_native.sh
      - name: Build and test
        run: scripts/build.sh
      - name: Frame rates
        run: scripts/bench_deko.sh 10 3 4 7 9

  # Cross build from x86-64, tests under qemu-user: the setup most contributors have.
  cross:
    needs: homebrew
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: homebrew
      - name: Unpack homebrew
        run: tar xzf artifacts.tar.gz
      - name: Install toolchain
        run: sudo scripts/cloud_setup.sh
      - name: Format
        run: git ls-files '*.c' '*.h' | grep -v '^ports/' | xargs clang-format --dry-run --Werror
      - name: Build and test
        run: scripts/build.sh

  # libFuzzer harnesses (#11). Pull requests and branches get a deterministic
  # run (fixed seed, bounded iterations), so a latent bug cannot turn an
  # unrelated change red at random; main gets a minute per harness with the
  # corpus kept between runs. Same-repository pull requests already ran on push.
  fuzz:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-rt-18-dev cmake ninja-build
      - uses: actions/cache@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: build/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz, deterministic
        if: github.ref != 'refs/heads/main'
        run: scripts/fuzz.sh --runs 50000
      - name: Fuzz for a minute each, corpus kept
        if: github.ref == 'refs/heads/main'
        run: scripts/fuzz.sh 60
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: build/fuzz/artifacts
          retention-days: 7

  # The GitHub Action (action.yml) used as a homebrew project would use it.
  action:
    needs: homebrew
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: homebrew
      - name: Unpack homebrew
        run: |
          tar xzf artifacts.tar.gz
          mkdir -p sd && echo 2 > sd/deko_example.txt
      - name: A libnx program that exits on its own
        uses: ./
        with:
          app: examples/libnx_hello/build/hello.nso
          duration-ms: 5000
          expect-log: 'libnx hello: done'
      - name: An .nro with its RomFS, frames dumped
        uses: ./
        with:
          app: build/deko_examples/deko_examples.nro
          sdmc: sd
          duration-ms: 8000
          frames-dir: frames
          frames-every: 20
          expect-log: 'frames presented: [0-9]+'
      - uses: actions/upload-artifact@v4
        with:
          name: action-frames
          path: frames
          retention-days: 7
